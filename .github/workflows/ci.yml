name: CI/CD Quality Gate & Security Audit

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  backend-tests:
    name: Backend Pytest & Security Audit Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx pip-audit

      - name: Audit Backend Dependencies for Vulnerabilities
        run: |
          cd backend
          pip-audit -r requirements.txt

      - name: Run Backend Pytest Suite
        run: |
          cd backend
          pytest

  frontend-tests:
    name: Frontend Audit, Vitest & Build Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Audit Frontend Dependencies for Vulnerabilities
        run: |
          cd frontend
          npm audit --audit-level=high

      - name: Run Vitest Unit Tests
        run: |
          cd frontend
          npx vitest run

      - name: Verify Frontend Production Build
        run: |
          cd frontend
          npm run build
